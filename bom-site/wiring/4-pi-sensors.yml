    - BK
    - GN
    - OG
    - VT
    - BK
    category: bundle
  W_LD2450:
    gauge: 26 AWG
    length: 0.25
    colors:
    - RD
    - BK
    - GN
    - WH
    category: bundle
    notes: 5V, GND, radar TX → Pi RXD, radar RX ← Pi TXD — one 4-wire Dupont lead
